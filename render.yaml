# Free testing service; PostgreSQL is supplied by Neon via DATABASE_URL.
services:
  - type: web
    name: prancheta-testes
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    autoDeployTrigger: "off"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOW_SIGNUP
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: S3_KEY_PREFIX
        value: "prancheta/testes"
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
