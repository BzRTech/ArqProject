# Ambiente local de desenvolvimento: `docker compose up`
#   front  → http://localhost:5173  (Vite; /api é repassado ao Django)
#   API    → http://localhost:8000/api/health/  · docs em /api/docs/
#   admin  → http://localhost:8000/admin/
#   S3     → http://localhost:8333  (SeaweedFS, compatível com S3; ver docs/adr/002-s3-local.md)
name: prancheta

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
  DATABASE_URL: postgres://${POSTGRES_USER:-prancheta}:${POSTGRES_PASSWORD:-prancheta}@postgres:5432/${POSTGRES_DB:-prancheta}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://s3:8333
  S3_BUCKET: ${S3_BUCKET:-prancheta}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-prancheta}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-prancheta-dev-secret}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prancheta}
      POSTGRES_USER: ${POSTGRES_USER:-prancheta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prancheta}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.50
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment: *backend-env
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  s3data:
  frontend_node_modules:
