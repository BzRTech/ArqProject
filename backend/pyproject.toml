[project]
name = "prancheta-backend"
version = "0.1.0"
description = "Prancheta — API Django (projetos, bancos, memorial)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<4",
    "drf-spectacular>=0.28",
    "django-storages[s3]>=1.14",
    "dj-database-url>=2.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "jsonschema>=4.23",
    "boto3>=1.35",
    "openpyxl>=3.1",
    "weasyprint>=66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
# RUF012 conflita com o estilo declarativo do Django (Meta, Admin, REQUIRED_FIELDS).
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
